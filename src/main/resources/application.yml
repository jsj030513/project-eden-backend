spring:
  application:
    name: project-eden-backend
  servlet:
    multipart:
      # Permit one byte above Vision's application limit so Vision can return its stable 413 payload.
      max-file-size: 10485761B
      max-request-size: 11MB
  jpa:
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:project-eden-local-development-secret-key-2026-access-token}
  access-token-expiration: 3600000

eden:
  vision-api:
    enabled: ${EDEN_VISION_API_ENABLED:false}
    base-url: ${EDEN_VISION_API_BASE_URL:http://127.0.0.1:8090}
    connect-timeout: ${EDEN_VISION_API_CONNECT_TIMEOUT:3s}
    read-timeout: ${EDEN_VISION_API_READ_TIMEOUT:30s}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/project_eden}
    username: ${SPRING_DATASOURCE_USERNAME:eden_user}
    password: ${SPRING_DATASOURCE_PASSWORD:eden_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
