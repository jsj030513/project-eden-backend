spring:
  application:
    name: project-eden-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/project_eden}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:eden_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000

eden:

  vision:
    enabled: ${EDEN_VISION_ENABLED:false}
    runtime: ${EDEN_VISION_RUNTIME:onnx}
    model:
      type: ${EDEN_VISION_MODEL_TYPE:yolox-nano}
      path: ${EDEN_VISION_MODEL_PATH:}
      sha256: ${EDEN_VISION_MODEL_SHA256:}
    yolox:
      confidence-threshold: ${EDEN_VISION_YOLOX_CONFIDENCE_THRESHOLD:0.20}
      nms-threshold: ${EDEN_VISION_YOLOX_NMS_THRESHOLD:0.45}
      max-detections: ${EDEN_VISION_YOLOX_MAX_DETECTIONS:100}
    rules:
      activity-threshold: ${EDEN_VISION_ACTIVITY_THRESHOLD:0.65}
      relationship-threshold: ${EDEN_VISION_RELATIONSHIP_THRESHOLD:0.55}
      proximity-threshold: ${EDEN_VISION_PROXIMITY_THRESHOLD:0.25}
    taxonomy:
      object-threshold: ${EDEN_VISION_TAXONOMY_OBJECT_THRESHOLD:0.50}
      activity-threshold: ${EDEN_VISION_TAXONOMY_ACTIVITY_THRESHOLD:0.70}
      relationship-threshold: ${EDEN_VISION_TAXONOMY_RELATIONSHIP_THRESHOLD:0.75}

  image-normalization:
    enabled: ${EDEN_IMAGE_NORMALIZATION_ENABLED:true}
    encoded-max-bytes: ${EDEN_IMAGE_NORMALIZATION_ENCODED_MAX_BYTES:15728640}
    provider-max-bytes: ${EDEN_IMAGE_NORMALIZATION_PROVIDER_MAX_BYTES:10485760}
    max-width: ${EDEN_IMAGE_NORMALIZATION_MAX_WIDTH:8192}
    max-height: ${EDEN_IMAGE_NORMALIZATION_MAX_HEIGHT:8192}
    max-pixels: ${EDEN_IMAGE_NORMALIZATION_MAX_PIXELS:24000000}
    max-output-width: ${EDEN_IMAGE_NORMALIZATION_MAX_OUTPUT_WIDTH:2560}
    max-output-height: ${EDEN_IMAGE_NORMALIZATION_MAX_OUTPUT_HEIGHT:2560}
    jpeg-quality: ${EDEN_IMAGE_NORMALIZATION_JPEG_QUALITY:0.88}
    max-frames-to-probe: ${EDEN_IMAGE_NORMALIZATION_MAX_FRAMES:20}
    output-max-bytes: ${EDEN_IMAGE_NORMALIZATION_OUTPUT_MAX_BYTES:10485760}

  photo-storage:
    root: ${EDEN_PHOTO_STORAGE_ROOT:${user.home}/.project-eden/uploads/photos}

  dataset:
    enabled: ${EDEN_DATASET_ENABLED:false}
    collection:
      enabled: ${EDEN_DATASET_COLLECTION_ENABLED:false}
    root: ${EDEN_DATASET_ROOT:}

  benchmark:
    orchestration:
      enabled: ${EDEN_BENCHMARK_ORCHESTRATION_ENABLED:false}
      prediction-source: ${EDEN_BENCHMARK_PREDICTION_SOURCE:supplied}

  image-observation:
    provider: ${EDEN_IMAGE_OBSERVATION_PROVIDER:mock}
    max-image-bytes: ${EDEN_IMAGE_OBSERVATION_MAX_IMAGE_BYTES:10485760}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_VISION_MODEL:}
      base-url: ${OPENAI_API_BASE_URL:https://api.openai.com/v1}
      connect-timeout-ms: ${OPENAI_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:15000}
      max-retries: ${OPENAI_MAX_RETRIES:1}
      image-detail: ${OPENAI_IMAGE_DETAIL:auto}
  image-evaluation:
    enabled: ${EDEN_IMAGE_EVALUATION_ENABLED:false}
    manifest: ${EDEN_IMAGE_EVALUATION_MANIFEST:}
    output-directory: ${EDEN_IMAGE_EVALUATION_OUTPUT:}
    max-cases: ${EDEN_IMAGE_EVALUATION_MAX_CASES:100}
