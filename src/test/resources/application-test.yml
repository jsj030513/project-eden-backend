spring:
  datasource:
    url: jdbc:h2:mem:project_eden;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

jwt:
  secret: project-eden-test-only-secret-key-with-at-least-32-bytes

eden:
  photo-storage:
    root: ${java.io.tmpdir}/project-eden-test-photos
  image-normalization:
    enabled: true
  image-observation:
    provider: mock
  image-evaluation:
    enabled: false
